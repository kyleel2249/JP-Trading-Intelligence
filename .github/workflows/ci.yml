name: JP Trading Intelligence CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
      - run: test -s public/index.html && test -s public/styles.css && test -s public/app.js && test -s worker/index.js && test -s migrations/0001_init.sql
