name = "jp-trading-intelligence"
main = "worker/index.js"
compatibility_date = "2026-11-23"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "jp-trading-intelligence"
database_id = "c453f9dd-a823-4bc2-9e31-31e77989fa8b"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "production"
LIVE_TRADING_ENABLED = "false"
